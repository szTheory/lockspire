name: Release Please Auto Merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: release-please-automerge-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  automerge:
    name: Merge then await exact post-merge CI evidence
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Merge one eligible Release Please PR or dispatch from its exact post-merge CI run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CI_EVENT: ${{ github.event.workflow_run.event }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CI_EVENT" = "push"
          test "$CI_HEAD_SHA" = "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')"

          prs_json="$(gh pr list --state open --base main --author app/github-actions --json number,title,headRefName,baseRefName,isDraft,mergeable,files,url)"
          eligible_json="$(jq '[.[] | select(.headRefName == "release-please--branches--main--components--lockspire") | select(.baseRefName == "main") | select(.isDraft == false) | select(.title | test("^chore\\(main\\): release lockspire [0-9]+\\.[0-9]+\\.[0-9]+$"))]' <<< "$prs_json")"
          count="$(jq 'length' <<< "$eligible_json")"

          if [[ "$count" == "1" ]]; then
            actual_files="$(jq -r '.[0].files[].path' <<< "$eligible_json" | sort | paste -sd ',' -)"
            test "$actual_files" = ".release-please-manifest.json,CHANGELOG.md,mix.exs"
            pr_number="$(jq -r '.[0].number' <<< "$eligible_json")"
            gh pr merge "$pr_number" --squash --delete-branch
            echo "Merged Release Please PR #$pr_number. Publication deliberately waits for that merge commit's own CI push run."
            exit 0
          fi

          test "$count" = "0"
          merged_json="$(gh pr list --state merged --base main --author app/github-actions --limit 100 --json number,title,headRefName,baseRefName,isDraft,mergeCommit,files)"
          match_json="$(jq --arg sha "$CI_HEAD_SHA" '[.[] | select(.headRefName == "release-please--branches--main--components--lockspire") | select(.baseRefName == "main") | select(.title | test("^chore\\(main\\): release lockspire [0-9]+\\.[0-9]+\\.[0-9]+$")) | select(.mergeCommit.oid == $sha)]' <<< "$merged_json")"
          test "$(jq 'length' <<< "$match_json")" = "1"
          pr_number="$(jq -r '.[0].number' <<< "$match_json")"

          gh workflow run release.yml --ref main \
            --field recovery_ref="$CI_HEAD_SHA" \
            --field source_ci_run_id="$CI_RUN_ID" \
            --field recovery_reason="Release Please PR #$pr_number merge validated by CI run $CI_RUN_ID"
