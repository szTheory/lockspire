name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  ELIXIR_VERSION: "1.19.5"
  OTP_VERSION: "28"
  MIN_ELIXIR_VERSION: "1.18.4"
  MIN_OTP_VERSION: "27"

jobs:
  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Elixir and Erlang
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore Dialyzer cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            priv/plts
            deps
            _build
          key: ${{ runner.os }}-dialyzer-v1-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-dialyzer-v1-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Run zero-warning Dialyzer
        run: bash ./scripts/ci/run_dialyzer.sh

  release-hygiene:
    name: Release Hygiene Drift
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify repo-owned release hygiene contract
        run: bash ./scripts/maintainer/repo_hygiene_check.sh --ci

      - name: Lint workflows and maintained shell scripts
        run: bash ./scripts/ci/lint_workflows.sh

      - name: Verify and audit Release Please runtime dependencies
        run: |
          npm ci --prefix .github/actions/release-please/runtime --ignore-scripts
          npm audit --omit=dev --audit-level=moderate --prefix .github/actions/release-please/runtime
          node --input-type=module --eval 'await import("./.github/actions/release-please/runtime/index.js")'

      - name: Verify dependency setup did not rewrite locks
        run: git diff --exit-code -- mix.lock examples/adoption_demo/mix.lock compatibility/phoenix_1_8_live_view_1_1/mix.lock .github/actions/release-please/runtime/package-lock.json

  fast:
    name: Fast Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16@sha256:485935f94cc7165afa896978809c37b592dc07f0a37d2c8f645f12412d0212c8 # postgres:16 verified 2026-08-26
        env:
          POSTGRES_DB: lockspire_test
          POSTGRES_USER: lockspire
          POSTGRES_PASSWORD: lockspire
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lockspire -d lockspire_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      LOCKSPIRE_TEST_DB_HOST: 127.0.0.1
      LOCKSPIRE_TEST_DB_PORT: "5432"
      LOCKSPIRE_TEST_DB_USER: lockspire
      LOCKSPIRE_TEST_DB_PASSWORD: lockspire
      LOCKSPIRE_TEST_DB_NAME: lockspire_test
      CLEAN_ROOM_DB_HOST: 127.0.0.1
      CLEAN_ROOM_DB_PORT: "5432"
      CLEAN_ROOM_DB_USER: lockspire
      CLEAN_ROOM_DB_PASSWORD: lockspire
      CLEAN_ROOM_DB_NAME: lockspire_test

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Release proof fixtures resolve historical Phase 139 commit ancestry.
        with:
          fetch-depth: 0

      - name: Set up Elixir and Erlang
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore Mix cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-fast-v2-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-fast-v2-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Install dependencies
        run: mix deps.get --check-locked

      - name: Wait for PostgreSQL
        run: |
          for _attempt in $(seq 1 30); do
            pg_isready -h "$LOCKSPIRE_TEST_DB_HOST" -p "$LOCKSPIRE_TEST_DB_PORT" -U "$LOCKSPIRE_TEST_DB_USER" -d "$LOCKSPIRE_TEST_DB_NAME" && exit 0
            sleep 1
          done
          echo "PostgreSQL did not become ready in time" >&2
          exit 1

      - name: Run qa gate
        run: mix qa

      - name: Verify dependency truth and architecture topology
        run: bash scripts/ci/check_dependency_truth.sh

      - name: Build docs
        run: mix docs.verify

      - name: Audit dependencies (retired + CVEs)
        run: mix deps.audit

      - name: Verify Hex package
        run: mix package.build

      - name: Verify admin multi-value controls
        run: node --test test/browser/admin_multi_value_test.mjs

      - name: Run fast tests with built-in coverage
        run: bash scripts/ci/run_test_matrix.sh --fast .artifacts/ci/fast-timings.json .artifacts/ci/coverage/fast "${{ github.sha }}"

      - name: Upload SHA-bound fast coverage evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lockspire-coverage-fast-${{ github.sha }}
          path: |
            .artifacts/ci/coverage/fast/fast.coverdata
            .artifacts/ci/coverage/fast/fast.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload fast test timing
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fast-test-timings
          path: .artifacts/ci/fast-timings.json
          retention-days: 14

      - name: Verify migration reversibility
        run: |
          env MIX_ENV=test mix ecto.rollback --all
          env MIX_ENV=test mix ecto.migrate

  compatibility:
    name: Minimum Supported Elixir/OTP
    runs-on: ubuntu-latest
    # The floor verifier partition took 1,020s for its raw scenario receipts;
    # allow the existing compile/test/proof graph plus the bounded 25m wrapper.
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:14@sha256:7e900619df8eca59f34c7fb280a0bcb46e51c75f1697e98bb99f31183f71b762 # postgres:14 verified 2026-08-26
        env:
          POSTGRES_DB: lockspire_test
          POSTGRES_USER: lockspire
          POSTGRES_PASSWORD: lockspire
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lockspire -d lockspire_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      LOCKSPIRE_TEST_DB_HOST: 127.0.0.1
      LOCKSPIRE_TEST_DB_PORT: "5432"
      LOCKSPIRE_TEST_DB_USER: lockspire
      LOCKSPIRE_TEST_DB_PASSWORD: lockspire
      LOCKSPIRE_TEST_DB_NAME: lockspire_test
      CLEAN_ROOM_DB_HOST: 127.0.0.1
      CLEAN_ROOM_DB_PORT: "5432"
      CLEAN_ROOM_DB_USER: lockspire
      CLEAN_ROOM_DB_PASSWORD: lockspire

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Release proof fixtures resolve historical Phase 139 commit ancestry.
        with:
          fetch-depth: 0

      - name: Set up minimum supported Elixir and Erlang
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.MIN_ELIXIR_VERSION }}
          otp-version: ${{ env.MIN_OTP_VERSION }}

      - name: Restore Mix cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
            tmp/lockspire-compatibility-fixture/deps
            tmp/lockspire-compatibility-fixture/_build
          key: ${{ runner.os }}-mix-compat-v2-${{ env.MIN_OTP_VERSION }}-${{ env.MIN_ELIXIR_VERSION }}-${{ hashFiles('mix.lock', 'compatibility/phoenix_1_8_live_view_1_1/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-compat-v2-${{ env.MIN_OTP_VERSION }}-${{ env.MIN_ELIXIR_VERSION }}-

      - name: Install dependencies
        run: mix deps.get --check-locked

      - name: Provision authenticated verifier candidate inputs
        id: verifier-candidate
        env:
          EXPECTED_RUNNER_REVISION: ${{ github.sha }}
        run: >-
          python3 scripts/ci/provision_verifier_candidate.py
          --expected-runner "$EXPECTED_RUNNER_REVISION"
          --reviewed-candidate-source
          --manifest-path .artifacts/phase178/ci-candidate/178-FROZEN-INPUTS.json
          --github-output "$GITHUB_OUTPUT"

      - name: Wait for PostgreSQL
        run: |
          for _attempt in $(seq 1 30); do
            pg_isready -h "$LOCKSPIRE_TEST_DB_HOST" -p "$LOCKSPIRE_TEST_DB_PORT" -U "$LOCKSPIRE_TEST_DB_USER" -d "$LOCKSPIRE_TEST_DB_NAME" && exit 0
            sleep 1
          done
          echo "PostgreSQL did not become ready in time" >&2
          exit 1

      - name: Compile minimum supported pair
        run: mix compile --warnings-as-errors

      - name: Run fast tests on minimum supported pair
        run: mix test.fast

      - name: Install exact Phoenix and LiveView compatibility fixture
        working-directory: compatibility/phoenix_1_8_live_view_1_1
        run: mix deps.get --check-locked

      - name: Compile exact Phoenix and LiveView compatibility fixture
        working-directory: compatibility/phoenix_1_8_live_view_1_1
        run: mix compile --warnings-as-errors

      - name: Restore floor host proof dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/host-integration-cache/floor
          key: ${{ runner.os }}-host-proof-floor-test-v1-${{ env.MIN_OTP_VERSION }}-${{ env.MIN_ELIXIR_VERSION }}-${{ hashFiles('compatibility/phoenix_1_8_live_view_1_1/mix.lock') }}

      - name: Run exact-floor packaged host proof
        id: host-proof-floor
        run: bash scripts/ci/run_host_integration_proof.sh --pair floor --receipt-dir .artifacts/ci/host-integration/floor

      - name: Run exact-floor installed verifier upgrade proof
        id: verifier-proof-floor
        env:
          EXPECTED_RUNNER: ${{ steps.verifier-candidate.outputs.expected_runner }}
          EXPECTED_CANDIDATE_SOURCE: ${{ steps.verifier-candidate.outputs.expected_candidate_source }}
          EXPECTED_ARCHIVE_SHA256: ${{ steps.verifier-candidate.outputs.expected_archive_sha256 }}
          EXPECTED_TREE_SHA256: ${{ steps.verifier-candidate.outputs.expected_tree_sha256 }}
          EXPECTED_MANIFEST_SHA256: ${{ steps.verifier-candidate.outputs.expected_manifest_sha256 }}
        run: >-
          bash scripts/ci/run_verifier_upgrade_proof.sh --pair floor
          --receipt-dir .artifacts/phase178/ci-floor
          --expected-runner "$EXPECTED_RUNNER"
          --expected-candidate-source "$EXPECTED_CANDIDATE_SOURCE"
          --expected-archive-sha256 "$EXPECTED_ARCHIVE_SHA256"
          --expected-tree-sha256 "$EXPECTED_TREE_SHA256"
          --expected-manifest-sha256 "$EXPECTED_MANIFEST_SHA256"

      - name: Upload validated exact-floor verifier upgrade receipts
        if: always() && steps.verifier-proof-floor.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lockspire-verifier-upgrade-${{ github.sha }}-floor
          path: .artifacts/phase178/ci-floor/validated/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload validated exact-floor host proof receipts
        if: always() && steps.host-proof-floor.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lockspire-host-integration-${{ github.sha }}-floor
          path: .artifacts/ci/host-integration/floor/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Verify compatibility fixture lock stayed unchanged
        run: git diff --exit-code -- mix.lock compatibility/phoenix_1_8_live_view_1_1/mix.lock

  integration:
    name: Integration Checks
    runs-on: ubuntu-latest
    # The integration suite + host proof measured 792s; the locked verifier
    # scenario window measured 1,112s. Their 31.7m combined time exceeds 30m,
    # so reserve 45m for setup, validation, and observed runtime variance.
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16@sha256:485935f94cc7165afa896978809c37b592dc07f0a37d2c8f645f12412d0212c8 # postgres:16 verified 2026-08-26
        env:
          POSTGRES_DB: lockspire_test
          POSTGRES_USER: lockspire
          POSTGRES_PASSWORD: lockspire
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lockspire -d lockspire_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      LOCKSPIRE_TEST_DB_HOST: 127.0.0.1
      LOCKSPIRE_TEST_DB_PORT: "5432"
      LOCKSPIRE_TEST_DB_USER: lockspire
      LOCKSPIRE_TEST_DB_PASSWORD: lockspire
      LOCKSPIRE_TEST_DB_NAME: lockspire_test
      CLEAN_ROOM_DB_HOST: 127.0.0.1
      CLEAN_ROOM_DB_PORT: "5432"
      CLEAN_ROOM_DB_USER: lockspire
      CLEAN_ROOM_DB_PASSWORD: lockspire
      CLEAN_ROOM_DB_NAME: lockspire_test

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Elixir and Erlang
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore Mix cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-integration-v2-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-integration-v2-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Restore clean-room child dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tmp/clean-room-cache/provider/deps
            tmp/clean-room-cache/client/deps
          key: ${{ runner.os }}-clean-room-deps-v1-provider-client-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('test/clean_room/provider_host/mix.lock', 'test/clean_room/confidential_client/mix.lock') }}

      - name: Restore locked host proof dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/host-integration-cache/locked
          key: ${{ runner.os }}-host-proof-locked-test-v1-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('test/clean_room/provider_host/mix.lock') }}

      - name: Install dependencies
        run: mix deps.get --check-locked

      - name: Provision authenticated verifier candidate inputs
        id: verifier-candidate
        env:
          EXPECTED_RUNNER_REVISION: ${{ github.sha }}
        run: >-
          python3 scripts/ci/provision_verifier_candidate.py
          --expected-runner "$EXPECTED_RUNNER_REVISION"
          --reviewed-candidate-source
          --manifest-path .artifacts/phase178/ci-candidate/178-FROZEN-INPUTS.json
          --github-output "$GITHUB_OUTPUT"

      - name: Wait for PostgreSQL
        run: |
          for _attempt in $(seq 1 30); do
            pg_isready -h "$LOCKSPIRE_TEST_DB_HOST" -p "$LOCKSPIRE_TEST_DB_PORT" -U "$LOCKSPIRE_TEST_DB_USER" -d "$LOCKSPIRE_TEST_DB_NAME" && exit 0
            sleep 1
          done
          echo "PostgreSQL did not become ready in time" >&2
          exit 1

      - name: Run integration suite including onboarding and OIDC E2E proof
        run: CLEAN_ROOM_CACHE_ROOT="$GITHUB_WORKSPACE/tmp/clean-room-cache" bash scripts/ci/run_test_matrix.sh --integration .artifacts/ci/integration-timings.json .artifacts/ci/coverage/integration "${{ github.sha }}"

      - name: Run locked packaged host proof
        id: host-proof-locked
        run: bash scripts/ci/run_host_integration_proof.sh --pair locked --receipt-dir .artifacts/ci/host-integration/locked

      - name: Run locked installed verifier upgrade proof
        id: verifier-proof-locked
        env:
          EXPECTED_RUNNER: ${{ steps.verifier-candidate.outputs.expected_runner }}
          EXPECTED_CANDIDATE_SOURCE: ${{ steps.verifier-candidate.outputs.expected_candidate_source }}
          EXPECTED_ARCHIVE_SHA256: ${{ steps.verifier-candidate.outputs.expected_archive_sha256 }}
          EXPECTED_TREE_SHA256: ${{ steps.verifier-candidate.outputs.expected_tree_sha256 }}
          EXPECTED_MANIFEST_SHA256: ${{ steps.verifier-candidate.outputs.expected_manifest_sha256 }}
        run: >-
          bash scripts/ci/run_verifier_upgrade_proof.sh --pair locked
          --receipt-dir .artifacts/phase178/ci-locked
          --expected-runner "$EXPECTED_RUNNER"
          --expected-candidate-source "$EXPECTED_CANDIDATE_SOURCE"
          --expected-archive-sha256 "$EXPECTED_ARCHIVE_SHA256"
          --expected-tree-sha256 "$EXPECTED_TREE_SHA256"
          --expected-manifest-sha256 "$EXPECTED_MANIFEST_SHA256"

      - name: Upload validated locked verifier upgrade receipts
        if: always() && steps.verifier-proof-locked.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lockspire-verifier-upgrade-${{ github.sha }}-locked
          path: .artifacts/phase178/ci-locked/validated/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload validated locked host proof receipts
        if: always() && steps.host-proof-locked.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lockspire-host-integration-${{ github.sha }}-locked
          path: .artifacts/ci/host-integration/locked/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Validate client lifetime receipt
        id: validate-client-lifetime-receipt
        if: always()
        env:
          EXPECTED_SOURCE_REVISION: ${{ github.sha }}
        run: |
          test -s .artifacts/ci/client-lifetimes/receipt.json
          test -s .artifacts/ci/client-lifetimes/validation.json
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          receipt = json.loads(Path(".artifacts/ci/client-lifetimes/receipt.json").read_text())
          validation = json.loads(Path(".artifacts/ci/client-lifetimes/validation.json").read_text())
          expected = os.environ["EXPECTED_SOURCE_REVISION"]
          assert set(receipt) == {"schema_version", "source_revision", "candidate", "scenarios", "counts", "cleanup"}
          assert set(receipt["candidate"]) == {
              "kind", "version", "archive_sha256", "tree_sha256", "source_revision"
          }
          assert receipt["candidate"]["source_revision"] == expected
          identity = ":".join(
              str(receipt["candidate"][key])
              for key in ("kind", "version", "archive_sha256", "tree_sha256", "source_revision")
          )
          candidate_digest = hashlib.sha256(identity.encode("utf-8")).hexdigest()
          scenarios = {
              "fresh.register_use",
              "fresh.secret_expiry_rotate",
              "fresh.management_put_recover",
              "fresh.app_expiry_disabled",
              "custom.issue_replace",
              "custom.shared_rollback",
              "custom.unsupported",
              "legacy.public",
              "legacy.tenant_auth",
          }
          assert set(validation) == {
              "schema_version", "source_revision", "candidate_digest", "expected_scenarios",
              "executed", "passed", "failed", "skipped", "valid"
          }
          assert validation["valid"] is True
          assert validation["source_revision"] == expected
          assert validation["candidate_digest"] == candidate_digest
          assert set(validation["expected_scenarios"]) == scenarios
          assert validation["executed"] == validation["passed"] > 0
          assert validation["failed"] == validation["skipped"] == 0
          assert receipt["source_revision"] == expected
          assert all(set(scenario) == {
              "id", "leg", "contract_case_ids", "outcome", "observations", "event_counts", "audit_counts", "counts"
          } for scenario in receipt["scenarios"])
          assert {scenario["id"] for scenario in receipt["scenarios"]} == scenarios
          assert receipt["counts"]["executed"] == receipt["counts"]["passed"] > 0
          assert receipt["counts"]["failed"] == receipt["counts"]["skipped"] == 0
          PY

      - name: Upload SHA-bound client lifetime receipts
        if: always() && steps.validate-client-lifetime-receipt.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lockspire-client-lifetimes-${{ github.sha }}
          path: |
            .artifacts/ci/client-lifetimes/receipt.json
            .artifacts/ci/client-lifetimes/validation.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload SHA-bound integration coverage evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lockspire-coverage-integration-${{ github.sha }}
          path: |
            .artifacts/ci/coverage/integration/integration.coverdata
            .artifacts/ci/coverage/integration/integration.json
          if-no-files-found: error
          retention-days: 7

  coverage-aggregate:
    name: Complete Coverage Evidence
    needs: [fast, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Elixir and Erlang
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Install dependencies
        run: mix deps.get --check-locked

      - name: Download SHA-bound fast coverage evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: lockspire-coverage-fast-${{ github.sha }}
          path: .artifacts/ci/coverage/fast

      - name: Download SHA-bound integration coverage evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: lockspire-coverage-integration-${{ github.sha }}
          path: .artifacts/ci/coverage/integration

      - name: Aggregate imported coverage without rerunning tests
        run: bash scripts/ci/aggregate_coverage.sh --expected-sha "${{ github.sha }}" --input .artifacts/ci/coverage --output .artifacts/ci/coverage-aggregate

  adoption-demo:
    name: Adoption Demo Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16@sha256:485935f94cc7165afa896978809c37b592dc07f0a37d2c8f645f12412d0212c8 # postgres:16 verified 2026-08-26
        env:
          POSTGRES_DB: lockspire_adoption_demo
          POSTGRES_USER: lockspire
          POSTGRES_PASSWORD: lockspire
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lockspire -d lockspire_adoption_demo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: dev
      LOCKSPIRE_DEMO_DB_HOST: 127.0.0.1
      LOCKSPIRE_DEMO_DB_PORT: "5432"
      LOCKSPIRE_DEMO_DB_USER: lockspire
      LOCKSPIRE_DEMO_DB_PASSWORD: lockspire
      LOCKSPIRE_DEMO_DB_NAME: lockspire_adoption_demo
      LOCKSPIRE_DEMO_BASE_URL: http://127.0.0.1:4100

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Elixir and Erlang
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore adoption demo Mix cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            examples/adoption_demo/deps
            examples/adoption_demo/_build
          key: ${{ runner.os }}-mix-adoption-demo-v1-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('examples/adoption_demo/mix.lock', 'mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-adoption-demo-v1-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Install adoption demo dependencies
        working-directory: examples/adoption_demo
        run: mix deps.get --check-locked

      - name: Verify adoption demo lock stayed unchanged
        run: git diff --exit-code -- examples/adoption_demo/mix.lock compatibility/phoenix_1_8_live_view_1_1/mix.lock

      - name: Wait for PostgreSQL
        run: |
          for _attempt in $(seq 1 30); do
            pg_isready -h "$LOCKSPIRE_DEMO_DB_HOST" -p "$LOCKSPIRE_DEMO_DB_PORT" -U "$LOCKSPIRE_DEMO_DB_USER" -d "$LOCKSPIRE_DEMO_DB_NAME" && exit 0
            sleep 1
          done
          echo "PostgreSQL did not become ready in time" >&2
          exit 1

      - name: Compile adoption demo
        working-directory: examples/adoption_demo
        run: mix compile --warnings-as-errors

      - name: Prepare adoption demo database
        working-directory: examples/adoption_demo
        run: mix ecto.setup

      - name: Run adoption demo black-box smoke
        run: |
          mkdir -p tmp
          cd examples/adoption_demo
          mix phx.server > ../../tmp/adoption_demo.log 2>&1 &
          server_pid=$!
          cd ../..

          set +e
          python3 scripts/demo/adoption_smoke.py
          smoke_status=$?
          kill "$server_pid" 2>/dev/null || true

          if [ "$smoke_status" -ne 0 ]; then
            cat tmp/adoption_demo.log
            exit "$smoke_status"
          fi

      - name: Check demo signing keys are sealed
        working-directory: examples/adoption_demo
        run: mix lockspire.keys.reencrypt --check

      - name: Doctor key encryption
        working-directory: examples/adoption_demo
        run: mix lockspire.doctor key_encryption
