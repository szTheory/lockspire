name: Supplemental OIDF Conformance

on:
  schedule:
    - cron: "17 5 * * 2"
  workflow_dispatch:
    inputs:
      run_hosted_lane:
        description: "Also run the hosted or staging provider lane"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: supplemental-oidf-${{ github.ref }}
  cancel-in-progress: true

env:
  ELIXIR_VERSION: "1.19.5"
  OTP_VERSION: "28"
  PYTHON_VERSION: "3.13.15"
  PIP_VERSION: "26.2.1"

jobs:
  repo-native-phase37:
    name: Repo-Native Phase 37 Lane
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16@sha256:485935f94cc7165afa896978809c37b592dc07f0a37d2c8f645f12412d0212c8 # postgres:16 verified 2026-08-26
        env:
          POSTGRES_DB: lockspire_test
          POSTGRES_USER: lockspire
          POSTGRES_PASSWORD: lockspire
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lockspire -d lockspire_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      LOCKSPIRE_TEST_DB_HOST: 127.0.0.1
      LOCKSPIRE_TEST_DB_PORT: "5432"
      LOCKSPIRE_TEST_DB_USER: lockspire
      LOCKSPIRE_TEST_DB_PASSWORD: lockspire
      LOCKSPIRE_TEST_DB_NAME: lockspire_test
      LOCKSPIRE_OIDF_EPHEMERAL_DB: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Elixir and Erlang
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          pip-version: ${{ env.PIP_VERSION }}

      - name: Install checksum-locked OIDF runner dependencies
        run: bash scripts/conformance/install_runner_dependencies.sh

      - name: Install dependencies
        run: mix deps.get --check-locked

      - name: Check immutable conformance inputs
        run: mix lockspire.oidf_conformance --check

      - name: Run repo-native Phase 37 proof
        run: |
          mix test.setup
          mix test --include integration test/integration/phase37_protocol_strictness_e2e_test.exs

      - name: Run immutable supplemental Phase 37 profile against a throwaway host
        run: bash scripts/conformance/run_ephemeral_oidf_profile.sh phase37

      - name: Upload redacted Phase 37 receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: supplemental-phase37-${{ github.run_id }}
          path: .artifacts/conformance/phase37/receipt.json
          if-no-files-found: error
          retention-days: 30

  repo-native-fapi2:
    name: Repo-Native FAPI 2.0 Lane
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16@sha256:485935f94cc7165afa896978809c37b592dc07f0a37d2c8f645f12412d0212c8 # postgres:16 verified 2026-08-26
        env:
          POSTGRES_DB: lockspire_test
          POSTGRES_USER: lockspire
          POSTGRES_PASSWORD: lockspire
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lockspire -d lockspire_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      LOCKSPIRE_TEST_DB_HOST: 127.0.0.1
      LOCKSPIRE_TEST_DB_PORT: "5432"
      LOCKSPIRE_TEST_DB_USER: lockspire
      LOCKSPIRE_TEST_DB_PASSWORD: lockspire
      LOCKSPIRE_TEST_DB_NAME: lockspire_test
      LOCKSPIRE_OIDF_EPHEMERAL_DB: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Elixir and Erlang
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          pip-version: ${{ env.PIP_VERSION }}

      - name: Install checksum-locked OIDF runner dependencies
        run: bash scripts/conformance/install_runner_dependencies.sh

      - name: Install dependencies
        run: mix deps.get --check-locked

      - name: Check immutable conformance inputs
        run: mix lockspire.oidf_conformance --check

      - name: Run immutable supplemental FAPI 2.0 profile against a throwaway host
        run: bash scripts/conformance/run_ephemeral_oidf_profile.sh fapi2

      - name: Upload redacted FAPI 2.0 receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: supplemental-fapi2-${{ github.run_id }}
          path: .artifacts/conformance/fapi2/receipt.json
          if-no-files-found: error
          retention-days: 30

  hosted-maintainer-lane:
    name: Hosted Maintainer Lane
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_hosted_lane }}

    services:
      postgres:
        image: postgres:16@sha256:485935f94cc7165afa896978809c37b592dc07f0a37d2c8f645f12412d0212c8 # postgres:16 verified 2026-08-26
        env:
          POSTGRES_DB: lockspire_test
          POSTGRES_USER: lockspire
          POSTGRES_PASSWORD: lockspire
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lockspire -d lockspire_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      LOCKSPIRE_TEST_DB_HOST: 127.0.0.1
      LOCKSPIRE_TEST_DB_PORT: "5432"
      LOCKSPIRE_TEST_DB_USER: lockspire
      LOCKSPIRE_TEST_DB_PASSWORD: lockspire
      LOCKSPIRE_TEST_DB_NAME: lockspire_test

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Elixir and Erlang
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          pip-version: ${{ env.PIP_VERSION }}

      - name: Install checksum-locked OIDF runner dependencies
        run: bash scripts/conformance/install_runner_dependencies.sh

      - name: Install dependencies
        run: mix deps.get --check-locked

      - name: Run hosted maintainer lane
        run: bash scripts/conformance/run_phase37_suite.sh
        env:
          LOCKSPIRE_OIDF_PROVIDER_CONFIG_JSON: ${{ secrets.LOCKSPIRE_OIDF_HOSTED_PROVIDER_CONFIG_JSON }}

      - name: Upload redacted hosted receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: supplemental-phase37-hosted-${{ github.run_id }}
          path: .artifacts/conformance/phase37/receipt.json
          if-no-files-found: error
          retention-days: 14
