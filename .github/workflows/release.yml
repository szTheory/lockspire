name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      recovery_reason:
        description: Exact-ref automation or recovery note
        required: true
        type: string
      recovery_ref:
        description: Full immutable commit SHA to publish
        required: true
        type: string
      source_ci_run_id:
        description: Successful CI push run for recovery_ref
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  ELIXIR_VERSION: "1.19.5"
  OTP_VERSION: "28"

jobs:
  release-please:
    name: Maintain Release Please PR
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/release-please
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
      - name: Retry auto-merge when CI finished before Release Please
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          runs_json="$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=100")"
          ci_run_id="$(jq -r --arg sha "$SOURCE_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.run_number) | last | .id // empty' <<< "$runs_json")"

          if [[ -z "$ci_run_id" ]]; then
            echo "CI for $SOURCE_SHA has not completed successfully; its workflow_run event will retry auto-merge."
            exit 0
          fi

          gh workflow run release-please-automerge.yml --ref main \
            --field source_sha="$SOURCE_SHA" \
            --field source_ci_run_id="$ci_run_id"

  recovery-validation:
    name: Validate exact main head and CI evidence
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      verified_sha: ${{ steps.validate.outputs.verified_sha }}
      source_ci_run_id: ${{ steps.validate.outputs.source_ci_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate immutable ref and matching CI run
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RECOVERY_REASON: ${{ inputs.recovery_reason }}
          RECOVERY_REF: ${{ inputs.recovery_ref }}
          SOURCE_CI_RUN_ID: ${{ inputs.source_ci_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RECOVERY_REASON"
          [[ "$RECOVERY_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_CI_RUN_ID" =~ ^[0-9]+$ ]]
          git fetch --no-tags origin main
          verified_sha="$(git rev-parse --verify "${RECOVERY_REF}^{commit}")"
          test "$verified_sha" = "$RECOVERY_REF"
          test "$verified_sha" = "$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$verified_sha" origin/main
          ci_run="$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_CI_RUN_ID")"
          canonical_ci_workflow_id="$(gh api "repos/$GH_REPO/actions/workflows/ci.yml" --jq '.id')"
          test "$(jq -r '.name' <<< "$ci_run")" = "CI"
          test "$(jq -r '.path' <<< "$ci_run")" = ".github/workflows/ci.yml"
          test "$(jq -r '.workflow_id' <<< "$ci_run")" = "$canonical_ci_workflow_id"
          test "$(jq -r '.event' <<< "$ci_run")" = "push"
          test "$(jq -r '.head_branch' <<< "$ci_run")" = "main"
          test "$(jq -r '.status' <<< "$ci_run")" = "completed"
          test "$(jq -r '.conclusion' <<< "$ci_run")" = "success"
          test "$(jq -r '.head_sha' <<< "$ci_run")" = "$verified_sha"
          test "$(jq -r '.repository.full_name' <<< "$ci_run")" = "$GH_REPO"
          echo "verified_sha=$verified_sha" >> "$GITHUB_OUTPUT"
          echo "source_ci_run_id=$SOURCE_CI_RUN_ID" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish verified release to Hex
    needs: recovery-validation
    if: ${{ needs.recovery-validation.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: hex-publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.recovery-validation.outputs.verified_sha }}
          fetch-depth: 0
      - name: Detach verified commit
        env:
          VERIFIED_SHA: ${{ needs.recovery-validation.outputs.verified_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$VERIFIED_SHA"
          test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - run: |
          mix local.hex --force
          mix local.rebar --force
      - run: mix deps.get --check-locked
      - run: mix release.preflight
      - name: Publish package
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes
      - name: Create matching GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERIFIED_SHA: ${{ needs.recovery-validation.outputs.verified_sha }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^[[:space:]]*version:[[:space:]]*"([^"]+)".*/\1/p' mix.exs | head -1)"
          tag_name="lockspire-v$version"
          notes="$(awk -v version="$version" '$0 ~ "^## \\[" version "\\]" { found=1; next } found && $0 ~ "^## \\[" { exit } found { print }' CHANGELOG.md)"
          test -n "$notes"
          if gh release view "$tag_name" --json targetCommitish --jq '.targetCommitish' >/tmp/release-target 2>/dev/null; then
            test "$(git rev-parse "$(cat /tmp/release-target)^{commit}")" = "$VERIFIED_SHA"
          else
            gh release create "$tag_name" --target "$VERIFIED_SHA" --title "lockspire: v$version" --notes "$notes"
          fi
  post-publish-install-truth:
    name: Verify public install truth
    needs: [recovery-validation, publish]
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.recovery-validation.outputs.verified_sha }}
      - name: Verify published package and HexDocs
        shell: bash
        run: scripts/publish/verify_install_truth.sh 2>&1 | tee install-truth.log
      - name: Upload install-truth log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: install-truth-${{ needs.recovery-validation.outputs.verified_sha }}
          path: install-truth.log
